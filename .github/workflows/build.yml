name: Build NEON CITY
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python2.7 libelf-dev libtool-bin wget

      - name: Download PS3 Toolchain
        run: |
          cd ${{ github.workspace }}
          wget -q https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz
          tar xzf ps3dev-ubuntu-latest-2020-08-31.tar.gz
          echo "PS3DEV=${{ github.workspace }}/ps3dev" >> $GITHUB_ENV
          echo "PSL1GHT=${{ github.workspace }}/ps3dev" >> $GITHUB_ENV

      - name: Verify toolchain
        run: |
          echo "=== ppu_rules location ==="
          ls -la $PSL1GHT/ppu_rules || echo "NOT AT TOP LEVEL"
          find $PSL1GHT -name "ppu_rules" 2>/dev/null | head -5

      - name: Build SELF
        run: make

      - name: List outputs
        run: ls -la *.self *.elf 2>/dev/null || true

      - name: Upload SELF
        uses: actions/upload-artifact@v4
        with:
          name: neoncity-self
          path: |
            neoncity.self
            neoncity.elf
          if-no-files-found: error