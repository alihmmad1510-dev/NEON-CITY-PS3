name: Build NEON CITY
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python2.7 libelf-dev libtool-bin wget

      - name: Download toolchain
        run: |
          wget -q https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz
          tar xzf ps3dev-ubuntu-latest-2020-08-31.tar.gz

      - name: Build SELF
        run: make all

      - name: Build PKG
        continue-on-error: true
        run: make pkg

      - name: List outputs
        if: always()
        run: |
          echo "=== outputs ==="
          ls -la *.self *.elf *.pkg 2>/dev/null

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neoncity-all
          path: |
            neoncity.self
            neoncity.elf
            neoncity.pkg
          if-no-files-found: warn