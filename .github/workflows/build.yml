name: Diagnose Toolchain
on: [workflow_dispatch]

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Download PS3 Toolchain
        run: |
          cd ${{ github.workspace }}
          wget -q https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz
          tar xzf ps3dev-ubuntu-latest-2020-08-31.tar.gz

      - name: Show top-level structure
        run: |
          echo "=== ps3dev top ==="
          ls -la ps3dev/ || echo "NO ps3dev FOLDER"

      - name: Find ppu_rules
        run: |
          echo "=== searching for ppu_rules ==="
          find . -name "ppu_rules" -type f 2>/dev/null

      - name: Find ppu-gcc
        run: |
          echo "=== searching for ppu-gcc ==="
          find . -name "ppu-gcc" -type f 2>/dev/null | head -5

      - name: Show Makefile content
        run: |
          echo "=== Makefile ==="
          cat Makefile

      - name: Show main.c head
        run: |
          echo "=== src/main.c (first 20 lines) ==="
          head -20 src/main.c 2>/dev/null || echo "NO src/main.c"