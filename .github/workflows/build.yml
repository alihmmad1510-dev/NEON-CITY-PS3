name: Build NEON CITY
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python2.7 libelf-dev libtool-bin wget

      - name: Download PS3 Toolchain
        run: |
          cd ${{ github.workspace }}
          wget -q https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz
          tar xzf ps3dev-ubuntu-latest-2020-08-31.tar.gz

      - name: Find ppu_rules location
        run: |
          echo "=== Looking for ppu_rules ==="
          find ${{ github.workspace }} -name "ppu_rules" 2>/dev/null

      - name: Set env
        run: |
          PSL1GHT_PATH=$(dirname $(find ${{ github.workspace }} -name "ppu_rules" 2>/dev/null | head -1))
          echo "Found ppu_rules in: $PSL1GHT_PATH"
          echo "PS3DEV=${{ github.workspace }}/ps3dev" >> $GITHUB_ENV
          echo "PSL1GHT=$PSL1GHT_PATH" >> $GITHUB_ENV

      - name: Verify env
        run: |
          echo "PSL1GHT=$PSL1GHT"
          echo "PS3DEV=$PS3DEV"
          ls -la $PSL1GHT/ppu_rules

      - name: Build SELF
        run: make

      - name: List outputs
        run: |
          ls -la
          ls -la *.self *.elf 2>/dev/null || echo "no .self/.elf"

      - name: Upload SELF
        uses: actions/upload-artifact@v4
        with:
          name: neoncity-self
          path: |
            *.self
            *.elf
          if-no-files-found: warn