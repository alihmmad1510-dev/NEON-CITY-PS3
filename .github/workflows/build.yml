name: NEON CITY PS3 Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files
        run: |
          echo "=== PROJECT FILES ==="
          find . -maxdepth 3 -type f | sort

      - name: Show Makefile
        run: |
          echo "=== MAKEFILE ==="
          cat Makefile