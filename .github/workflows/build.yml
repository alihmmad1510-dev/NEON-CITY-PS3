name: Build NEON CITY PKG
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-dev libelf-dev libtool-bin wget git build-essential

      - name: Download PS3 Toolchain
        run: |
          wget -q https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz
          tar xzf ps3dev-ubuntu-latest-2020-08-31.tar.gz

      - name: Build SELF (Game Binary)
        run: make all

      - name: Create FSELF (Fake-signed Self)
        run: |
          if [ -f ps3dev/bin/make_fself ]; then
            chmod +x ps3dev/bin/make_fself
            ps3dev/bin/make_fself neoncity.elf neoncity.fself
            echo "✅ FSELF created via make_fself"
          else
            cp neoncity.self neoncity.fself
            echo "⚠️ make_fself not found, using self as fself"
          fi

      - name: Get Updated ps3py (Python 3 Compatible)
        run: |
          git clone --depth 1 --branch use-python3 https://github.com/sahlberg/PSL1GHT.git /tmp/psl1ght-py3
          echo "=== ps3py files ==="
          ls -la /tmp/psl1ght-py3/tools/ps3py/

      - name: Build pkgcrypt Python extension
        run: |
          cd /tmp/psl1ght-py3/tools/ps3py
          # Build the C extension module
          python3 setup.py build_ext --inplace
          ls -la *.so

      - name: Prepare PKG Directory Structure
        run: |
          mkdir -p pkgbuild/USRDIR
          cp neoncity.fself pkgbuild/USRDIR/EBOOT.BIN
          # Create PARAM.SFO using the updated sfo.py
          cd /tmp/psl1ght-py3/tools/ps3py
          python3 sfo.py --help 2>&1 | head -5 || echo "sfo.py help failed, trying direct"
          # Try creating SFO with the script's expected arguments
          cd ${{ github.workspace }}
          python3 tools/make_sfo.py pkgbuild/PARAM.SFO || echo "SFO creation via custom script failed"

      - name: Build PKG with Updated pkg.py
        continue-on-error: true
        run: |
          set +e
          cd /tmp/psl1ght-py3/tools/ps3py
          echo "=== Current directory: $(pwd) ==="
          ls -la

          BUILD_DIR="${{ github.workspace }}/pkgbuild"
          OUT_PKG="${{ github.workspace }}/neoncity.pkg"
          CID="UP0001-NEONCITY1_00-NEONCITY00000001"

          echo "=== Testing pkg.py usage ==="
          python3 pkg.py --help 2>&1 | head -20

          echo "=== Attempting PKG build (Variant 1: --contentid) ==="
          python3 pkg.py --contentid "$CID" "$BUILD_DIR" "$OUT_PKG" 2>&1
          if [ -f "$OUT_PKG" ]; then echo "✅ PKG created via Variant 1"; exit 0; fi

          echo "=== Attempting PKG build (Variant 2: positional) ==="
          python3 pkg.py "$CID" "$BUILD_DIR" "$OUT_PKG" 2>&1
          if [ -f "$OUT_PKG" ]; then echo "✅ PKG created via Variant 2"; exit 0; fi

          echo "=== Attempting PKG build (Variant 3: -c flag) ==="
          python3 pkg.py -c "$CID" "$BUILD_DIR" "$OUT_PKG" 2>&1
          if [ -f "$OUT_PKG" ]; then echo "✅ PKG created via Variant 3"; exit 0; fi

          echo "❌ All pkg.py attempts failed"
          echo "=== pkg.py source (first 100 lines) ==="
          head -100 pkg.py

      - name: Final Output Listing
        if: always()
        run: |
          echo "=== All build outputs ==="
          ls -la ${{ github.workspace }}/*.self \
                 ${{ github.workspace }}/*.elf \
                 ${{ github.workspace }}/*.fself \
                 ${{ github.workspace }}/*.pkg 2>/dev/null || true
          echo ""
          echo "=== PKG build directory ==="
          find pkgbuild -type f 2>/dev/null || true
          echo ""
          echo "=== pkgcrypt extension ==="
          ls -la /tmp/psl1ght-py3/tools/ps3py/*.so 2>/dev/null || echo "No .so file"

      - name: Upload All Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoncity-pkg-build
          path: |
            neoncity.self
            neoncity.elf
            neoncity.fself
            neoncity.pkg
            pkgbuild/**
          if-no-files-found: warn