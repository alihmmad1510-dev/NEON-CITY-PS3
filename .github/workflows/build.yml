name: Build NEON CITY
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python2.7 libelf-dev libtool-bin wget

      - name: Download PS3 Toolchain
        run: |
          cd ${{ github.workspace }}
          wget -q https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz
          tar xzf ps3dev-ubuntu-latest-2020-08-31.tar.gz

      - name: Set PSL1GHT environment variable
        run: |
          # البحث عن مجلد ppu_rules تلقائيًا
          PSL1GHT_PATH=$(dirname $(find ${{ github.workspace }} -name "ppu_rules" -type f | head -n 1))
          echo "Found PSL1GHT at: $PSL1GHT_PATH"
          echo "PSL1GHT=$PSL1GHT_PATH" >> $GITHUB_ENV
          echo "PS3DEV=${{ github.workspace }}/ps3dev" >> $GITHUB_ENV

      - name: Build
        run: make

      - name: Upload SELF
        uses: actions/upload-artifact@v4
        with:
          name: neoncity-self
          path: |
            neoncity.self
            neoncity.elf
          if-no-files-found: error