name: Build NEON CITY
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 libelf-dev libtool-bin wget

      - name: Download toolchain
        run: |
          wget -q https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz
          tar xzf ps3dev-ubuntu-latest-2020-08-31.tar.gz

      - name: Build SELF
        run: make all

      - name: Show outputs
        run: ls -la neoncity.*

      - name: Make FSELF (final EBOOT)
        run: |
          if [ -f ps3dev/bin/make_fself ]; then
            chmod +x ps3dev/bin/make_fself
            ps3dev/bin/make_fself neoncity.elf EBOOT.BIN
            echo "✅ FSELF created via make_fself"
          else
            cp neoncity.self EBOOT.BIN
            echo "⚠️ make_fself not found — using self as EBOOT.BIN"
          fi
          ls -la EBOOT.BIN

      - name: Create HDD folder structure
        run: |
          mkdir -p build_out/USRDIR
          cp EBOOT.BIN build_out/USRDIR/EBOOT.BIN
          python3 tools/make_sfo.py build_out/PARAM.SFO || echo "sfo skipped"
          ls -la build_out/

      - name: Final listing
        if: always()
        run: |
          echo "=== Files ready for PS3 ==="
          ls -la EBOOT.BIN neoncity.self neoncity.elf 2>/dev/null
          echo "=== Folder structure ==="
          find build_out -type f 2>/dev/null

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoncity-build
          path: |
            EBOOT.BIN
            neoncity.self
            neoncity.elf
            build_out/**
          if-no-files-found: warn