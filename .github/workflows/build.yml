name: Build NEON CITY
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python2.7 libelf-dev libtool-bin wget

      - name: Download toolchain
        run: |
          cd ${{ github.workspace }}
          wget -q https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz
          tar xzf ps3dev-ubuntu-latest-2020-08-31.tar.gz
          echo "=== ps3dev top-level ==="
          ls -la ps3dev/
          echo "=== find any gcc ==="
          find ps3dev -name "*gcc*" -type f 2>/dev/null | head -10
          echo "=== find ppu-rules ==="
          find ps3dev -name "ppu_rules" -type f 2>/dev/null

      - name: Build
        run: make all

      - name: List outputs
        if: always()
        run: |
          echo "=== build dir ==="
          ls -la
          echo "=== self/elf files ==="
          ls -la *.self *.elf 2>/dev/null || echo "no outputs found"

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neoncity-build
          path: |
            *.self
            *.elf
          if-no-files-found: warn