# =====================================================================
#  FILE: .github/workflows/build.yml
#  PROJECT: NEON CITY ULTRA v4
#  DESCRIPTION: Build SELF + PKG (~45MB) with wallpapers
# =====================================================================

name: Build NEON CITY PKG
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip libelf-dev libtool-bin wget git
          pip3 install Pillow pycryptodome

      - name: Download toolchain
        run: |
          wget -q https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz
          tar xzf ps3dev-ubuntu-latest-2020-08-31.tar.gz

      - name: Build SELF
        run: make all

      - name: Make FSELF
        run: |
          if [ -f ps3dev/bin/make_fself ]; then
            chmod +x ps3dev/bin/make_fself
            ps3dev/bin/make_fself neoncity.elf neoncity.fself
            echo "FSELF created"
          else
            cp neoncity.self neoncity.fself
            echo "using self as fself"
          fi

      - name: Get ps3py
        run: |
          git clone --depth 1 --branch use-python3 https://github.com/sahlberg/PSL1GHT.git /tmp/psl1ght-py3
          ls -la /tmp/psl1ght-py3/tools/ps3py/ || true

      - name: Build pkgcrypt
        continue-on-error: true
        run: |
          cd /tmp/psl1ght-py3/tools/ps3py
          python3 setup.py build_ext --inplace 2>&1 | head -20 || true
          ls -la *.so 2>/dev/null || echo "no .so"

      - name: Prepare PKG structure
        run: |
          mkdir -p pkgbuild/USRDIR
          mkdir -p pkgbuild/USRDIR/wallpapers
          mkdir -p pkgbuild/USRDIR/previews
          cp neoncity.fself pkgbuild/USRDIR/EBOOT.BIN

          # detect python folder
          PYD="toles"
          if [ ! -f "$PYD/make_sfo.py" ]; then
            if [ -f "tools/make_sfo.py" ]; then PYD="tools"; fi
          fi
          echo "Using python folder: $PYD"

          python3 $PYD/make_sfo.py pkgbuild/PARAM.SFO || echo "sfo skipped"
          echo "=== Generating images (PNG + BMP) ==="
          OUT_DIR=$PWD python3 $PYD/make_icons.py

          cp ICON0.PNG pkgbuild/ICON0.PNG
          cp PIC0.PNG  pkgbuild/PIC0.PNG
          cp PIC1.PNG  pkgbuild/PIC1.PNG
          cp PREVIEW*.PNG pkgbuild/USRDIR/previews/ 2>/dev/null || true
          cp WALLPAPER*.BMP pkgbuild/USRDIR/wallpapers/ 2>/dev/null || true

          echo "=== PKG contents ==="
          find pkgbuild -type f -exec ls -lh {} \;
          echo "=== Total size ==="
          du -sh pkgbuild/

      - name: Build PKG
        continue-on-error: true
        run: |
          set +e
          cd /tmp/psl1ght-py3/tools/ps3py
          BUILD_DIR="${{ github.workspace }}/pkgbuild"
          OUT_PKG="${{ github.workspace }}/neoncity.pkg"
          CID="UP0001-NEONCITY1_00-NEONCITY00000001"

          echo "=== V1: --contentid ==="
          python3 pkg.py --contentid "$CID" "$BUILD_DIR" "$OUT_PKG" 2>&1
          if [ -f "$OUT_PKG" ]; then echo "PKG V1 OK"; exit 0; fi

          echo "=== V2: positional ==="
          python3 pkg.py "$CID" "$BUILD_DIR" "$OUT_PKG" 2>&1
          if [ -f "$OUT_PKG" ]; then echo "PKG V2 OK"; exit 0; fi

          echo "=== V3: -c flag ==="
          python3 pkg.py -c "$CID" "$BUILD_DIR" "$OUT_PKG" 2>&1
          if [ -f "$OUT_PKG" ]; then echo "PKG V3 OK"; exit 0; fi

          echo "All PKG attempts failed — EBOOT.BIN still available"

      - name: Final listing
        if: always()
        run: |
          echo "=== All outputs ==="
          ls -lh ${{ github.workspace }}/*.self \
                 ${{ github.workspace }}/*.elf \
                 ${{ github.workspace }}/*.fself \
                 ${{ github.workspace }}/*.pkg \
                 ${{ github.workspace }}/*.PNG \
                 ${{ github.workspace }}/*.BMP 2>/dev/null || true
          echo ""
          echo "=== PKG size ==="
          du -h ${{ github.workspace }}/neoncity.pkg 2>/dev/null || echo "no pkg"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoncity-build
          path: |
            neoncity.self
            neoncity.elf
            neoncity.fself
            neoncity.pkg
            ICON0.PNG
            PIC0.PNG
            PIC1.PNG
            PREVIEW*.PNG
            WALLPAPER*.BMP
            pkgbuild/**
          if-no-files-found: warn